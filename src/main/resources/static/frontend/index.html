<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Chat Frontend</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="join-overlay" id="joinOverlay" aria-modal="true" role="dialog">
    <form class="join-card" id="joinForm">
      <h2>Enter your name</h2>
      <p>Pick a display name to join the chat.</p>
      <input id="joinNameInput" placeholder="Your name" autocomplete="off" maxlength="32" />
      <button type="submit">Join chat</button>
    </form>
  </div>

  <main class="shell">
    <section class="panel">
      <header class="topbar">
        <div>
          <h1>Live Chat</h1>
          <p>Connect to Spring Boot websocket backend</p>
        </div>
        <div class="topbar-actions">
          <div class="badge" id="statusBadge">Disconnected</div>
          <button id="leaveBtn" class="ghost-btn" disabled>Disconnect</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form class="composer" id="composerForm">
        <input id="messageInput" placeholder="Type a message..." autocomplete="off" disabled />
        <button id="sendBtn" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
