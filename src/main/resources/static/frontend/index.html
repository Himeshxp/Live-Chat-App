<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Chat Frontend</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="auth-overlay" id="authOverlay" aria-modal="true" role="dialog">
    <form class="auth-card" id="authForm">
      <h2>Live Chat</h2>
      <p>Log in or create an account to message people directly.</p>

      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button type="button" class="auth-tab is-active" data-mode="login">Login</button>
        <button type="button" class="auth-tab" data-mode="register">Register</button>
      </div>

      <input id="usernameInput" class="auth-field auth-register-only" placeholder="Username" autocomplete="username" maxlength="32" />
      <input id="emailInput" class="auth-field" placeholder="Email" autocomplete="email" />
      <input id="passwordInput" class="auth-field" type="password" placeholder="Password" autocomplete="current-password" />

      <p class="auth-status" id="authStatus" aria-live="polite"></p>

      <button type="submit" id="authSubmitBtn">Login</button>
    </form>
  </div>

  <main class="shell">
    <section class="panel">
      <aside class="sidebar">
        <div class="profile-strip">
          <div>
            <span class="eyebrow">Signed in</span>
            <strong id="profileName">Not connected</strong>
          </div>
          <code id="profilePublicId">--------</code>
        </div>

        <form class="search-box" id="userSearchForm">
          <input id="publicIdSearchInput" placeholder="Search public ID" autocomplete="off" maxlength="10" />
          <button id="userSearchBtn" type="submit">Find</button>
        </form>
        <p class="search-status" id="userSearchStatus" aria-live="polite"></p>

        <div class="conversation-header">
          <h2>Chats</h2>
        </div>
        <div class="conversation-list" id="conversationList"></div>
      </aside>

      <div class="chat-column">
      <header class="topbar">
        <div>
          <h1 id="chatTitle">Select a chat</h1>
          <p id="chatSubtitle">Search a public ID or choose a conversation.</p>
        </div>
        <div class="topbar-actions">
          <div class="badge" id="statusBadge">Disconnected</div>
          <button id="leaveBtn" class="ghost-btn" disabled>Disconnect</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form class="composer" id="composerForm">
        <input id="messageInput" placeholder="Type a message..." autocomplete="off" disabled />
        <button id="sendBtn" type="submit" disabled>Send</button>
      </form>
      </div>
    </section>
  </main>

  <script src="./app.js?v=history-fix-2"></script>
</body>
</html>
