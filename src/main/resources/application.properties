spring.application.name=live-chat
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Fix 6: SQL logging off — never log queries in production (leaks schema structure)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Schema management.
# Use 'update' for the first deployment so Hibernate adds the avatar_color column.
# After that first deploy, switch to 'validate' and manage changes via Flyway.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT configuration (values injected from environment — never hardcode secrets here)
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# CORS allowed origins.
# Single-JAR deployment (Render, Railway, Fly.io, etc.):
#   The frontend is served from the same origin as the API, so set this to
#   your Render app URL once you have it, e.g. https://live-chat-xyz.onrender.com
#   Until then, the wildcard default works fine for local dev.
#   On Render: add ALLOWED_ORIGINS=https://your-app.onrender.com in the dashboard.
allowed.origins=${ALLOWED_ORIGINS:*}
